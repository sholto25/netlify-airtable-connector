<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airtable to Webflow Connector Test</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    #results {
      margin-top: 20px;
      border: 1px solid #ddd;
      padding: 20px;
      border-radius: 4px;
      background-color: #f9f9f9;
    }
    #loading {
      display: none;
    }
    pre {
      white-space: pre-wrap;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Airtable to Webflow Connector Test</h1>
  <p>This page tests the connection to your Airtable database via Netlify Functions.</p>
  
  <button id="fetchData">Fetch Data from Airtable</button>
  <span id="loading">Loading...</span>
  
  <div id="results">
    <p>Results will appear here...</p>
  </div>
  
  <script>
    document.getElementById('fetchData').addEventListener('click', async () => {
      const loadingEl = document.getElementById('loading');
      const resultsEl = document.getElementById('results');
      
      loadingEl.style.display = 'inline';
      resultsEl.innerHTML = '<p>Fetching data...</p>';
      
      try {
        // Fetch data from our Netlify function
        const response = await fetch('/api/airtable-data?table=YourTableName');
        
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        
        const data = await response.json();
        
        // Display the results
        resultsEl.innerHTML = `
          <h2>Data from Airtable</h2>
          <p>Found ${data.length} records:</p>
          <pre>${JSON.stringify(data, null, 2)}</pre>
        `;
      } catch (error) {
        resultsEl.innerHTML = `
          <h2>Error</h2>
          <p>${error.message}</p>
        `;
      } finally {
        loadingEl.style.display = 'none';
      }
    });
  </script>
</body>
</html>
